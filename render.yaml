# Render Blueprint: one free web service for MezGuard.
services:
  - type: web
    name: mezguard
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
# Upload two Secret Files in the Render dashboard (Environment > Secret Files):
#   dev-wallet.json  (keeper wallet for Mezo TESTNET only)
#   telegram.json    ({"token": "...", "bot": "..."})
